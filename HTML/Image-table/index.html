<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tags</title>
</head>

<body>
    <!-- HTML me <img> tag web page par image (tasveer) dikhane ke liye istemaal hota hai -->
    <img src="car.jpg" alt="thecar" width="200px" height="200px">
    <!-- koi closing tag (</img>) nahi hota -->

    <!-- 

        src (Source): Yeh sab se zaroori attribute hai. Is me aap apni image ka path ya URL likhte hain taake browser ko pata chale ke tasveer kahan se uthani hai. 

        alt (Alternate Text): Agar kisi wajah se tasveer load na ho sake, toh uski jagah yeh text nazar aata hai. Yeh Google
        SEO aur screen readers ke liye bohot zaroori hai.

        width aur height: Is se aap tasveer ki chorai (width) aur lambai (height) pixels me set kar sakte hain. 

    -->
    <!-- 
        HTML me table banane ke liye ek se zyada tags ka mil kar istemaal hota hai. Table rows (katarein) aur columns (khane) ke structure par kaam karta hai.

        Main Tags:

        <table>: Yeh pura table shuru aur khatam karne ke liye main tag hai.

        <tr> (Table Row): Table me naye row (katarr) banane ke liye istemaal hota hai.

        <th> (Table Header): Headings ke liye istemaal hota hai. Is ka text bold aur center-aligned hota hai.

        <td> (Table Data): Table ke aam khano (cells) me data ya text likhne ke liye istemaal hota hai. 
    -->

    <table border="1">
        <tr>
            <th>Naam</th>
            <th>Umar</th>
            <th>Shehar</th>
        </tr>
        <tr>
            <td>Ali</td>
            <td>22</td>
            <td>Karachi</td>
        </tr>
        <tr>
            <td>Usman</td>
            <td>25</td>
            <td>Lahore</td>
        </tr>
    </table>

    <!-- 
        colspan: Do ya us se zyada columns ko aapas me jodne (merge karne) ke liye.
        Example: <td colspan="2">Merge Column</td>
        rowspan: Do ya us se zyada rows ko aapas me jodne ke liye.
        Example: <td rowspan="2">Merge Row</td>
    -->
    
</body>

</html>
